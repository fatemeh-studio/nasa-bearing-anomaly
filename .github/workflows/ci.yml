# Proves the repository installs and passes its own gates on a machine that is not
# the author's. It never renders or publishes the site: that is done locally, because
# Quarto renders .ipynb from stored outputs and CI starts from a clean clone with
# neither the outputs nor the 6.2 GB raw dataset.

name: ci

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Tests
        run: pytest

  # A separate job, not a step, so a stripping failure reads distinctly from a test
  # failure on the Actions page. The action verifies; it modifies nothing.
  notebooks-stripped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kynan/nbstripout@main
        with:
          paths: 'notebooks/*.ipynb'
