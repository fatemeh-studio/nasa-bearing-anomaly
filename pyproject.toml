# Single source of truth for dependencies and every tool's configuration.
# environment.yml exists only to give conda users a one-command path to the same
# environment; it installs this file rather than duplicating it.

[build-system]
# setuptools>=77 is the floor for the SPDX `license` string below. The older
# `license = { text = "MIT" }` table form is deprecated and no longer supported.
# `wheel` is not listed: setuptools has built wheels without it since 70.1.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nasa-bearing-anomaly"
version = "0.1.0"
description = "Physics-informed unsupervised anomaly detection on the NASA IMS bearing run-to-failure dataset"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fatemeh Saghian", email = "fatemehsaghian.at@gmail.com" }]
keywords = [
    "predictive-maintenance",
    "anomaly-detection",
    "vibration-analysis",
    "condition-monitoring",
    "signal-processing",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

# Runtime only. Nothing here that the analysis can run without.
# PyWavelets, plotly, ipywidgets and torchvision may be added in future.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "basedpyright", "pre-commit", "nbstripout"]
# torch is ~2 GB and only the autoencoder needs it; the Isolation Forest path is
# complete without it. detection.py guards the import and disables the
# autoencoder when it is absent.
deep = ["torch>=2.0"]
# tqdm lives here rather than in dependencies because loading.py and features.py
# guard its import and fall back to a plain iterator. A progress bar only earns
# its place in an interactive session, which is what this extra is for.
notebook = ["jupyterlab", "ipykernel", "tqdm>=4.65"]

[project.urls]
Repository = "https://github.com/fatemeh-studio/nasa-bearing-anomaly"
Site = "https://fatemeh-studio.github.io/nasa-bearing-anomaly/"

[tool.setuptools.packages.find]
# True src-layout: src/ is a plain container, so this finds exactly one package,
# nasa_bearing_anomaly.
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# "D" landed together with the numpydoc conversion, which is the only honest way
# to adopt it: selecting a rule before doing the work it demands leaves the check
# permanently red, and a check that is always red is one nobody reads.
#
# The raw count without a convention set is misleading -- 95 findings in src/, of
# which 55 are rules the numpy convention itself disables. Against
# convention = "numpy" below it was 40, matching the 41 measured 2026-08-12.
select = ["E", "F", "I", "UP", "B", "SIM", "PD", "N", "D"]

ignore = [
    "E501",
    # N806 fires 25 times, on two established notations rather than on a style
    # choice. X / X_scaled / X_train / X_2d follow scikit-learn's design-matrix
    # convention, itself from mathematics -- matrices uppercase, vectors
    # lowercase, which is why sklearn's own API is fit(X, y). BPFO / BPFI / BSF /
    # FTF / D are the published bearing symbols from Harris (2001), Rolling
    # Bearing Analysis. Lowercasing either set would break the correspondence
    # with the sources the code is checkable against.
    "N806",
    # D203/D213 are each half of a pair whose other half the numpy convention
    # selects; ruff warns and ignores one of each pair anyway. Naming them keeps
    # the warning out of every run.
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# A test's name is its documentation -- test_two_file_tail_is_fully_removed says
# more than a docstring restating it would, and requiring one on all 90 would add
# noise without adding information. Docstrings are still written where a test
# pins something non-obvious; this only stops them being mandatory.
"tests/*" = ["D"]
# Notebook cells are prose-and-code; the markdown cell above a function is its
# documentation.
"notebooks/*" = ["D"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
