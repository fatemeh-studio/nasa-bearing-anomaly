# Conda path into the same environment pyproject.toml describes.
#
# pyproject.toml is the single source of truth for dependencies. Conda supplies
# only the interpreter here; every Python package, Jupyter included, comes from
# pip via the line at the bottom. Listing jupyterlab in both files would be two
# sources of truth for one package, and mixing a conda-installed jupyterlab with
# a pip-installed one is the standard way to break a conda environment.
#
# Never generated by `conda env export`: that emits platform-locked build strings
# which fail on a cloner's machine.
#
# Quarto is deliberately absent. It is a system-wide .deb, not a conda package --
# a conda install of it shadows the system binary whenever this environment is
# active and breaks the editor extension's quarto.path.
# See https://quarto.org/docs/download/

name: nasa-bearing-anomaly

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - pip:
      # Installs the package itself plus its declared dependencies. Without this
      # line the environment has an interpreter but not the project.
      #
      # [notebook] carries jupyterlab, ipykernel and tqdm. tqdm is optional --
      # loading.py falls back to a plain iterator without it -- but the raw load
      # is the longest operation in the project, so running it blind is not a
      # sensible default for anyone following this file.
      - -e .[dev,notebook]
